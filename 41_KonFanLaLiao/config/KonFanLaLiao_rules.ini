# ================================================================
# 孔防拉料安全距离设置（单位：毫米）
# 普通用户只需修改等号右边的数字，不要修改参数名称。
# t=板厚，r=折弯内R，L=腰型孔两端圆弧之间的直线段长度。
# ================================================================

[折弯类型设置]
# 例如填3：内R大于或等于3倍板厚时，当作大圆弧折弯并排除
大圆弧R厚比分界=3.0

[圆孔安全距离]
# 板厚 t 不大于下面数值时：S = 薄板板厚倍数×t + r
# 板厚 t 大于下面数值时：  S = 厚板板厚倍数×t + r
圆孔板厚分界=2.0
圆孔薄板板厚倍数=1.0
圆孔厚板板厚倍数=1.5

[腰型孔安全距离]
# L≤第一分界：             S = 短孔板厚倍数×t + r
# 第一分界<L≤第二分界： S = 中孔板厚倍数×t + r
# L>第二分界：              S = 长孔板厚倍数×t + r
腰型孔长度第一分界=25.0
腰型孔长度第二分界=50.0
腰型孔短孔板厚倍数=2.0
腰型孔中孔板厚倍数=2.5
腰型孔长孔板厚倍数=3.0
